name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Fixture check is RED then GREEN
        run: |
          set -euo pipefail
          if goal-run check --goal tests/fixtures/check_fail.md; then
            echo "expected RED (exit 1) on check_fail.md" >&2
            exit 1
          fi
          goal-run check --goal tests/fixtures/check_pass.md
