name: Secret scan (gitleaks)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
      - name: Scan (redacted)
        run: |
          set -euo pipefail
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
